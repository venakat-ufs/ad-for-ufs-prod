<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>United Field Services | Admin Login</title>
  <link rel="icon" type="image/jpeg" href="/united_field_services_inc_logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="top-bar">
    <a class="brand brand-link" href="/">
      <img src="/united_field_services_inc_logo.jpeg" alt="United Field Services logo" class="brand-logo">
      <span class="brand-name">United Field Services</span>
    </a>
    <div class="top-actions">
      <a class="admin-link" href="/form">Back to form</a>
    </div>
  </header>
  <main class="page">
    <section class="card" style="max-width:480px;">
      <div class="progress">Admin Access</div>
      <h1>Sign in</h1>
      <p class="subtitle">Enter your credentials to view captured leads.</p>
      <div id="error-banner" class="error-banner hidden" style="margin-bottom:12px;"></div>
      <form id="login-form" class="form-grid" style="grid-template-columns:1fr;">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
        </div>
        <div class="form-footer" style="justify-content:flex-start; margin-top:4px;">
          <button type="submit" class="primary-btn" id="submit-btn">Sign in</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    (async function() {
      const form = document.getElementById('login-form');
      const errorBanner = document.getElementById('error-banner');
      const submitBtn = document.getElementById('submit-btn');

      // Helper to clear all auth state
      function clearAllAuthCookies() {
        document.cookie = 'sb-access-token=; path=/; max-age=0; SameSite=Lax; Secure';
        document.cookie = 'sb-refresh-token=; path=/; max-age=0; SameSite=Lax; Secure';
      }

      // Fetch Supabase config from server
      let config;
      try {
        const configRes = await fetch('/api/supabase-config');
        if (!configRes.ok) {
          throw new Error(`Config request failed: ${configRes.status}`);
        }
        config = await configRes.json();
      } catch (e) {
        errorBanner.textContent = 'Failed to load configuration. Please refresh.';
        errorBanner.classList.remove('hidden');
        return;
      }

      if (!config.url || !config.anonKey) {
        errorBanner.textContent = 'Authentication not configured. Please contact administrator.';
        errorBanner.classList.remove('hidden');
        return;
      }

      const supabase = window.supabase.createClient(config.url, config.anonKey);

      // Check if this is a logout redirect - always clear everything
      const params = new URLSearchParams(window.location.search);
      if (params.has('logout')) {
        await supabase.auth.signOut();
        clearAllAuthCookies();
        // Clean URL without reloading
        window.history.replaceState({}, '', '/admin/login');
        // Don't check session, just show the login form
      } else {
        // Not a logout - check if user has a valid session
        try {
          const { data: { user }, error } = await supabase.auth.getUser();
          if (user && !error) {
            // User is genuinely authenticated, refresh cookies and redirect
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.access_token) {
              document.cookie = `sb-access-token=${session.access_token}; path=/; max-age=${60 * 60 * 24}; SameSite=Lax; Secure`;
              document.cookie = `sb-refresh-token=${session.refresh_token}; path=/; max-age=${60 * 60 * 24 * 7}; SameSite=Lax; Secure`;
              window.location.href = '/admin';
              return;
            }
          }
          // No valid user - clear everything stale
          await supabase.auth.signOut();
          clearAllAuthCookies();
        } catch (e) {
          // Validation failed, clear everything and show login
          await supabase.auth.signOut().catch(() => {});
          clearAllAuthCookies();
        }
      }

      // Login form handler
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          errorBanner.textContent = 'Please enter both email and password.';
          errorBanner.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
          return;
        }

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            errorBanner.textContent = error.message || 'Invalid credentials';
            errorBanner.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign in';
            return;
          }

          if (data.session) {
            document.cookie = `sb-access-token=${data.session.access_token}; path=/; max-age=${60 * 60 * 24}; SameSite=Lax; Secure`;
            document.cookie = `sb-refresh-token=${data.session.refresh_token}; path=/; max-age=${60 * 60 * 24 * 7}; SameSite=Lax; Secure`;
            window.location.href = '/admin';
          }
        } catch (err) {
          errorBanner.textContent = 'Login failed. Please try again.';
          errorBanner.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
